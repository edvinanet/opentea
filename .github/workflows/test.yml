#
# Runs the same checks Makefile's `check` target documents as "what CI/a
# pre-commit hook should run": gofmt formatting, go vet, and the full test
# suite. No cgo/toolchain setup needed -- modernc.org/sqlite is pure Go.
name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: fmt-check, vet, test
        run: make check
