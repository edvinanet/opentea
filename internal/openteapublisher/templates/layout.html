{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>opentea-publisher</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f7f7f8; color: #1a1a1a; }
  nav { background: #1a1a2e; color: #fff; padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 1.5rem; }
  nav a { color: #cbd5e1; text-decoration: none; }
  nav a:hover { color: #fff; }
  nav form { margin-left: auto; }
  nav button { background: none; border: 1px solid #475569; color: #cbd5e1; padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; }
  main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #e2e8f0; }
  form.inline { display: inline; }
  .error { background: #fee2e2; color: #991b1b; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
  label { display: block; margin-top: 0.6rem; font-size: 0.9rem; color: #475569; }
  input, select, button { font: inherit; padding: 0.4rem 0.6rem; border: 1px solid #cbd5e1; border-radius: 4px; margin-top: 0.2rem; }
  button[type=submit] { background: #1a1a2e; color: #fff; border: none; cursor: pointer; margin-top: 1rem; }
  .badge { display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
  .badge-admin { background: #dcfce7; color: #166534; }
  .badge-member { background: #e2e8f0; color: #475569; }
  .badge-pending { background: #fef9c3; color: #854d0e; }
  .badge-approved { background: #dcfce7; color: #166534; }
  .badge-rejected { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<nav>
  <a href="/">Dashboard</a>
  <a href="/approvals">Approvals</a>
  {{if eq .Staff.Role "admin"}}<a href="/staff">Staff</a><a href="/cicd-credentials">CI/CD credentials</a>{{end}}
  <form class="inline" action="/logout" method="post">
    <button type="submit">Logout ({{.Staff.Username}}, {{.Staff.Role}})</button>
  </form>
</nav>
<main>
{{template "content" .}}
</main>
</body>
</html>
{{end}}
