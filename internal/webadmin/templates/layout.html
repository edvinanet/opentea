{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenTEA Admin{{if .OrgName}} &mdash; {{.OrgName}}{{end}}</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f7f7f8; color: #1a1a1a; }
  nav { background: #1a1a2e; color: #fff; padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 1.5rem; }
  nav a { color: #cbd5e1; text-decoration: none; }
  nav a:hover { color: #fff; }
  nav form { margin-left: auto; }
  nav button { background: none; border: 1px solid #475569; color: #cbd5e1; padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; }
  main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { margin-top: 0; }
  .cards { display: flex; flex-wrap: wrap; gap: 1rem; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1.25rem 1.5rem; min-width: 160px; }
  a.card { display: block; text-decoration: none; color: inherit; }
  a.card:hover { border-color: #94a3b8; }
  .card .n { font-size: 2rem; font-weight: 700; }
  .card .l { color: #64748b; font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #e2e8f0; }
  form.inline { display: inline; }
  .error { background: #fee2e2; color: #991b1b; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
  .notice { background: #dcfce7; color: #166534; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
  label { display: block; margin-top: 0.6rem; font-size: 0.9rem; color: #475569; }
  input, select, button { font: inherit; padding: 0.4rem 0.6rem; border: 1px solid #cbd5e1; border-radius: 4px; margin-top: 0.2rem; }
  button[type=submit] { background: #1a1a2e; color: #fff; border: none; cursor: pointer; margin-top: 1rem; }
  code { background: #eef1f5; padding: 0.1rem 0.35rem; border-radius: 3px; }
  code.token { display: block; background: #1a1a2e; color: #a5f3fc; padding: 1rem; border-radius: 6px; word-break: break-all; margin-top: 0.5rem; }
</style>
</head>
<body>
<nav>
  <a href="/admin/ui/">Dashboard</a>
  <a href="/admin/ui/products">Products</a>
  <a href="/admin/ui/components">Components</a>
  {{if eq .User.Role "admin"}}<a href="/admin/ui/users">Users</a>{{end}}
  <a href="/admin/ui/token">API Token</a>
  {{if .OrgName}}<span style="color:#64748b">{{.OrgName}}</span>{{end}}
  <form class="inline" action="/admin/ui/logout" method="post">
    <button type="submit">Logout ({{.User.Username}}, {{.User.Role}})</button>
  </form>
</nav>
<main>
{{template "content" .}}
</main>
</body>
</html>
{{end}}
